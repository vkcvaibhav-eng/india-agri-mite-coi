name: Download COI records

on:
  workflow_dispatch:
    inputs:
      families:
        description: "Space-separated family keys, or 'all'"
        required: false
        default: "all"
      source:
        description: "ncbi, bold or both"
        required: false
        default: "both"
      geo:
        description: "Restrict the BOLD download to one country, e.g. India. Leave blank for the world set."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve family argument
        id: fam
        run: |
          if [ "${{ inputs.families }}" = "all" ] || [ -z "${{ inputs.families }}" ]; then
            echo "arg=" >> "$GITHUB_OUTPUT"
          else
            echo "arg=--family ${{ inputs.families }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch from NCBI
        if: inputs.source == 'ncbi' || inputs.source == 'both'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python scripts/fetch_ncbi.py ${{ steps.fam.outputs.arg }}

      - name: Fetch from BOLD
        if: inputs.source == 'bold' || inputs.source == 'both'
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.geo }}" ]; then
            python scripts/fetch_bold.py ${{ steps.fam.outputs.arg }} --geo "${{ inputs.geo }}"
          else
            python scripts/fetch_bold.py ${{ steps.fam.outputs.arg }}
          fi

      - name: Combine and deduplicate
        if: always()
        run: python scripts/combine.py

      - name: Upload snapshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coi-snapshot-${{ github.run_number }}
          path: |
            data/
            logs/
          retention-days: 90

      - name: Commit the snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data logs
          if git diff --cached --quiet; then
            echo "no change in the downloaded records"
          else
            git commit -m "COI snapshot $(date -u +%Y-%m-%d) (run ${{ github.run_number }})"
            git push
          fi
